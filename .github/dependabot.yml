# Montées de version regroupées, vérifiées par le build ; les correctifs de sécurité arrivent sans attendre ce calendrier
version: 2
updates:
  # Tous les POM sous controles/ ; le job non-conformes de la CI vérifie qu'une montée de version ne rend pas
  # conforme un projet qui doit échouer
  - package-ecosystem: maven
    directories:
      - "/controles/**"
    schedule:
      interval: monthly
    commit-message:
      prefix: build
    groups:
      maven:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: quarterly
    commit-message:
      prefix: build
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: quarterly
    commit-message:
      prefix: build
