name: build

on:
  push:
    branches: [main]
  pull_request:

# Moindre privilège : le workflow ne fait que lire le dépôt
permissions:
  contents: read

# Un nouveau push sur la même branche annule l'exécution en cours
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Tous les projets qui doivent passer, lancés d'un coup par le POM lanceur de controles/
  controles:
    runs-on: ubuntu-latest
    env:
      # Au niveau du job, seulement un indicateur oui/non : le jeton n'est donné qu'à l'étape Sonar
      HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Historique complet : Sonar en a besoin pour distinguer le nouveau code
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Tous les contrôles du build
        run: ./mvnw -B -ntp -f controles verify

      - name: Analyse Sonar et seuil de qualité
        # Sautée sans jeton : pull requests venant d'un fork, ou avant la mise en place de SonarQube Cloud
        if: env.HAS_SONAR_TOKEN == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw -B -ntp -f controles/chaine-complete/calendrier org.sonarsource.scanner.maven:sonar-maven-plugin:sonar

      - name: Conserver les rapports de mutation
        # Même en cas d'échec : c'est là qu'on cherche les mutants survivants
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-reports
          path: controles/**/target/pit-reports/

      - name: Conserver le SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: controles/chaine-complete/calendrier/target/bom.*

  # Chaque projet non conforme doit être rejeté par son outil, et pour la raison écrite dans son echec-attendu.txt :
  # c'est la preuve que la configuration détecte ce qu'elle doit détecter
  non-conformes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Les règles communes d'architecture sont une dépendance des projets qui les appliquent : installées d'abord
      - name: Installer les dépendances des projets non conformes
        run: ./mvnw -B -ntp -f controles/architecture/regles-communes install

      - name: Chaque projet non conforme échoue, pour la raison attendue
        run: |
          for projet in $(find controles -type d -name non-conforme | sort); do
            echo "::group::$projet"
            if ./mvnw -B -ntp -f "$projet" verify > build.log 2>&1; then
              cat build.log
              echo "::error::$projet devait échouer, il a réussi"
              exit 1
            fi
            if ! grep -qF -f "$projet/echec-attendu.txt" build.log; then
              cat build.log
              echo "::error::$projet a échoué, mais pas pour la raison attendue"
              exit 1
            fi
            echo "$projet : rejeté comme attendu"
            echo "::endgroup::"
          done
