name: weekly

# Failles publiées depuis le dernier commit, sur le code pas encore livré : chaque lundi, ou à la demande.
# Dependabot (alertes) et Dependency-Track (versions livrées) font le même travail ailleurs ; ce job le montre dans le build.
on:
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Base des failles conservée d'une exécution à l'autre : seules les nouveautés sont téléchargées
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-data-${{ github.run_id }}
          restore-keys: dependency-check-data-
      - name: OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./mvnw -B -ntp -f controles/chaine-complete/calendrier -Psecurite verify -DskipTests
      - name: Conserver le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: controles/chaine-complete/calendrier/target/dependency-check-report.*
